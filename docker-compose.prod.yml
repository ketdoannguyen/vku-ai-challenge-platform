# Production stack (Sprint 08) - file tự đứng, KHÔNG kế thừa docker-compose.yml.
#
# Khác biệt có chủ ý so với bản dev:
#   - Không publish bất kỳ port nào ra host. cloudflared đi vào `web:80` qua Docker network,
#     nên host chỉ còn lắng nghe SSH (master context §13). Muốn soi nội bộ thì dùng SSH tunnel.
#   - Dữ liệu bind-mount ra ngoài repo (`${PROD_DATA_ROOT}`) thay vì named volume, để backup
#     và di chuyển sang persistent disk là thao tác copy chứ không phải migrate dữ liệu.
#   - Env credential dùng `${VAR:?}` để thiếu .env là `up` dừng ngay, không âm thầm rơi về `changeme`.
#   - KHÔNG dùng `env_file:` cho service `api`: `.env` production chứa cả biến chỉ phục vụ Compose
#     (`PROD_DATA_ROOT`, `PROD_BACKUP_ROOT`, `CLOUDFLARE_TUNNEL_TOKEN`) và credential của thành phần
#     khác (`MONGO_USER`, `MONGO_PASSWORD`). Settings của backend bỏ qua khoá lạ, nên `env_file:`
#     không làm API chết - nhưng nó đẩy thêm credential vào một container không cần tới chúng.
#     Vì vậy `api` nhận đúng danh sách env bên dưới, không nhận cả file.
#
# Cách dùng (trên VM production):
#   sudo docker compose --env-file /srv/vku-ai-challenge/.env -f docker-compose.prod.yml up -d
#
# TUYỆT ĐỐI KHÔNG chạy `down -v`: dữ liệu nằm ở bind mount ngoài repo, nhưng thói quen đó sẽ
# xoá volume của stack khác trên cùng máy.

name: vku-challenge

services:
  mongo:
    image: mongo:7.0.43
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?MONGO_USER bắt buộc có trong .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD bắt buộc có trong .env}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-ai_challenge}
    # KHÔNG publish 27017 ra host (master context §13)
    expose:
      - "27017"
    volumes:
      - ${PROD_DATA_ROOT:?PROD_DATA_ROOT bắt buộc có trong .env}/mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER bắt buộc có trong .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD bắt buộc có trong .env}
    # KHÔNG publish 9000/9001 ra host (master context §13): MinIO chỉ nằm trong Docker network,
    # không route Nginx, không console public (ADR-028).
    expose:
      - "9000"
    volumes:
      # Bind mount ngoài repo như `mongo`: backup là thao tác copy, và `down -v` không xoá được nó.
      # Image chạy bằng root (UID 0) nên chỉ cần thư mục tồn tại và ghi được.
      - ${PROD_DATA_ROOT:?PROD_DATA_ROOT bắt buộc có trong .env}/minio:/data
    healthcheck:
      # `mc` có sẵn trong image MinIO (đã kiểm chứng trên đúng tag này), không cần curl/wget ngoài.
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging: *logging

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    # One-shot: tạo bucket private + app user least-privilege rồi thoát. Đây là service duy nhất
    # (cùng `minio`) nhận credential root; chạy lại khi cần xoay credential app.
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER bắt buộc có trong .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD bắt buộc có trong .env}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY bắt buộc có trong .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY bắt buộc có trong .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-submission-artifacts}
    volumes:
      - ./scripts/minio_init.sh:/bootstrap.sh:ro
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    logging: *logging

  api:
    build:
      context: ./backend
    image: vku-challenge-api:prod
    environment:
      APP_ENV: production
      APP_NAME: ${APP_NAME:-AI Challenge Platform}
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_DATABASE: ${MONGO_DATABASE:-ai_challenge}
      MONGO_USER: ${MONGO_USER:?MONGO_USER bắt buộc có trong .env}
      MONGO_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD bắt buộc có trong .env}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      MAX_NOTEBOOK_MB: ${MAX_NOTEBOOK_MB:-20}
      MAX_CONTENT_MB: ${MAX_CONTENT_MB:-2}
      MAX_ASSET_MB: ${MAX_ASSET_MB:-2}
      DATA_DIR: /data
      # Artifact của submission nằm trong MinIO private (ADR-028). `api` nhận credential của app;
      # MINIO_ROOT_USER/PASSWORD chỉ có ở `minio` và `minio-init`, không vào container này.
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY bắt buộc có trong .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY bắt buộc có trong .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-submission-artifacts}
      # SESSION_SECRET trong .env.example là config chết (ADR-008) - session là token ngẫu nhiên
      # server-side, không ký cookie, nên không truyền và không sinh thêm.
      SESSION_LIFETIME_HOURS: ${SESSION_LIFETIME_HOURS:-24}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-aic_session}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-auto}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-lax}
      # AI Notebook Review (ADR-036), tất cả dùng `${VAR:-}` chứ KHÔNG `${VAR:?}`: thiếu cấu hình AI
      # chỉ làm tính năng AI không bật được, tuyệt đối không được chặn deploy (quyết định sản phẩm #3).
      # Credential Mongo/MinIO ở trên vẫn fail-fast vì thiếu chúng thì stack không chạy được thật.
      LLM_CONFIG_ENCRYPTION_KEY: ${LLM_CONFIG_ENCRYPTION_KEY:-}
      AI_REVIEW_ALLOWED_HOSTS: ${AI_REVIEW_ALLOWED_HOSTS:-}
      AI_REVIEW_ALLOWED_PRIVATE_HOSTS: ${AI_REVIEW_ALLOWED_PRIVATE_HOSTS:-}
      AI_REVIEW_ALLOWED_HTTP_HOSTS: ${AI_REVIEW_ALLOWED_HTTP_HOSTS:-}
      AI_REVIEW_ALLOWED_PORTS: ${AI_REVIEW_ALLOWED_PORTS:-443}
    expose:
      - "8000" # internal only - đi qua Nginx same-origin (ADR-002)
    volumes:
      - ${PROD_DATA_ROOT:?PROD_DATA_ROOT bắt buộc có trong .env}/app:/data
    depends_on:
      mongo:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      # python:3.12-slim không có curl; dùng stdlib, urlopen raise khi status != 200.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    logging: *logging

  ai-review-worker:
    # CÙNG image với `api` (cùng tag `vku-challenge-api:prod`, cùng build context): worker là tiến
    # trình riêng, không phải background task trong API process - một lượt gọi provider mất hàng
    # chục giây, và API phải trả lời được kể cả khi LLM hỏng hoàn toàn.
    build:
      context: ./backend
    image: vku-challenge-api:prod
    command: ["python", "-m", "app.ai_review.worker"]
    environment:
      APP_ENV: production
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_DATABASE: ${MONGO_DATABASE:-ai_challenge}
      MONGO_USER: ${MONGO_USER:?MONGO_USER bắt buộc có trong .env}
      MONGO_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD bắt buộc có trong .env}
      DATA_DIR: /data
      # Worker đọc lại artifact từ MinIO khi cần chẩn đoán snapshot, và đọc Markdown thể lệ từ
      # `data_dir` để dựng ngữ cảnh - nên nó cần đúng credential app như `api`, không hơn.
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY bắt buộc có trong .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY bắt buộc có trong .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-submission-artifacts}
      # Cùng lý do với `api`: thiếu cấu hình AI không được chặn deploy.
      LLM_CONFIG_ENCRYPTION_KEY: ${LLM_CONFIG_ENCRYPTION_KEY:-}
      AI_REVIEW_ALLOWED_HOSTS: ${AI_REVIEW_ALLOWED_HOSTS:-}
      AI_REVIEW_ALLOWED_PRIVATE_HOSTS: ${AI_REVIEW_ALLOWED_PRIVATE_HOSTS:-}
      AI_REVIEW_ALLOWED_HTTP_HOSTS: ${AI_REVIEW_ALLOWED_HTTP_HOSTS:-}
      AI_REVIEW_ALLOWED_PORTS: ${AI_REVIEW_ALLOWED_PORTS:-443}
      AI_REVIEW_POLL_INTERVAL_SECONDS: ${AI_REVIEW_POLL_INTERVAL_SECONDS:-5}
      AI_REVIEW_LEASE_SECONDS: ${AI_REVIEW_LEASE_SECONDS:-180}
      AI_REVIEW_HEARTBEAT_SECONDS: ${AI_REVIEW_HEARTBEAT_SECONDS:-45}
      AI_REVIEW_MAX_ATTEMPTS: ${AI_REVIEW_MAX_ATTEMPTS:-3}
      AI_REVIEW_CONNECT_TIMEOUT_SECONDS: ${AI_REVIEW_CONNECT_TIMEOUT_SECONDS:-5}
      AI_REVIEW_REQUEST_TIMEOUT_SECONDS: ${AI_REVIEW_REQUEST_TIMEOUT_SECONDS:-60}
    # Không expose/publish port nào (master context §13): worker chỉ đi RA Mongo, MinIO và provider.
    volumes:
      - ${PROD_DATA_ROOT:?PROD_DATA_ROOT bắt buộc có trong .env}/app:/data
    depends_on:
      mongo:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    # SIGTERM dừng ở ranh giới job, không cắt ngang một lượt gọi provider. Hết ân hạn thì job bị
    # cắt và lease hết hạn sẽ được `recover_expired` thu hồi ở lượt sau - chậm hơn, không sai.
    stop_grace_period: 120s
    healthcheck:
      # Worker ghi file này mỗi vòng lặp kể cả khi hàng đợi rỗng (`worker.py:_touch`); mất dấu quá
      # 300s là vòng lặp đã chết, không phải "đang chạy job dài" (một lượt gọi tối đa 60s). Đổi
      # AI_REVIEW_HEARTBEAT_FILE thì phải đổi cả đường dẫn ở đây.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,sys,time; p='/tmp/ai-review-worker.heartbeat'; m=os.stat(p).st_mtime if os.path.exists(p) else 0; sys.exit(0 if time.time()-m < 300 else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging: *logging

  web:
    build:
      context: ./frontend
    image: vku-challenge-web:prod
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # nginx:1.27-alpine có wget của BusyBox; /healthz phục vụ tĩnh, không phụ thuộc SPA build.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging: *logging

  cloudflared:
    image: cloudflare/cloudflared:2026.9.1
    # Quick Tunnel: URL công khai ngẫu nhiên dạng *.trycloudflare.com, ĐỔI mỗi lần container
    # restart và không có SLA (Cloudflare xếp trycloudflare là công cụ test). Khi có domain thật
    # thì thay bằng named tunnel: `tunnel --no-autoupdate run` + CLOUDFLARE_TUNNEL_TOKEN.
    command:
      - tunnel
      - --no-autoupdate
      - --metrics
      - 127.0.0.1:20241
      - --url
      - http://web:80
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      # Image cloudflared là distroless (không có shell/curl), nhưng chính binary cloudflared
      # gọi được /ready của metrics server - đã kiểm chứng trả exit 0 khi tunnel lên.
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:20241", "ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging: *logging
