services:
  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: ${APP_NAME:-AI Challenge Platform}
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_DATABASE: ${MONGO_DATABASE:-ai_challenge}
      MONGO_USER: ${MONGO_USER:-changeme}
      MONGO_PASSWORD: ${MONGO_PASSWORD:-changeme}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      MAX_NOTEBOOK_MB: ${MAX_NOTEBOOK_MB:-20}
      MAX_CONTENT_MB: ${MAX_CONTENT_MB:-2}
      MAX_ASSET_MB: ${MAX_ASSET_MB:-2}
      DATA_DIR: /data
      # Artifact của submission nằm trong MinIO private (ADR-028). API chỉ nhận credential của app;
      # credential root chỉ có ở `minio` và `minio-init`.
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-app}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-appsecret}
      MINIO_BUCKET: ${MINIO_BUCKET:-submission-artifacts}
      # AI Notebook Review (ADR-036). Rỗng = tính năng tắt, KHÔNG phải app hỏng: allowlist rỗng
      # chỉ có nghĩa là không bật được AI, còn mọi luồng nộp bài/chấm điểm vẫn nguyên vẹn.
      LLM_CONFIG_ENCRYPTION_KEY: ${LLM_CONFIG_ENCRYPTION_KEY:-}
      AI_REVIEW_ALLOWED_HOSTS: ${AI_REVIEW_ALLOWED_HOSTS:-}
      AI_REVIEW_ALLOWED_PRIVATE_HOSTS: ${AI_REVIEW_ALLOWED_PRIVATE_HOSTS:-}
      AI_REVIEW_ALLOWED_HTTP_HOSTS: ${AI_REVIEW_ALLOWED_HTTP_HOSTS:-}
      AI_REVIEW_ALLOWED_PORTS: ${AI_REVIEW_ALLOWED_PORTS:-443}
    expose:
      - "8000" # internal only - truy cập qua Nginx same-origin
    depends_on:
      mongo:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    volumes:
      - data:/data

  ai-review-worker:
    # Cùng image backend với `api` (cùng build context): worker là TIẾN TRÌNH RIÊNG - một lượt gọi
    # provider mất hàng chục giây và không được nằm trong vòng đời của API process.
    build: ./backend
    command: ["python", "-m", "app.ai_review.worker"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_DATABASE: ${MONGO_DATABASE:-ai_challenge}
      MONGO_USER: ${MONGO_USER:-changeme}
      MONGO_PASSWORD: ${MONGO_PASSWORD:-changeme}
      DATA_DIR: /data
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-app}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-appsecret}
      MINIO_BUCKET: ${MINIO_BUCKET:-submission-artifacts}
      LLM_CONFIG_ENCRYPTION_KEY: ${LLM_CONFIG_ENCRYPTION_KEY:-}
      AI_REVIEW_ALLOWED_HOSTS: ${AI_REVIEW_ALLOWED_HOSTS:-}
      AI_REVIEW_ALLOWED_PRIVATE_HOSTS: ${AI_REVIEW_ALLOWED_PRIVATE_HOSTS:-}
      AI_REVIEW_ALLOWED_HTTP_HOSTS: ${AI_REVIEW_ALLOWED_HTTP_HOSTS:-}
      AI_REVIEW_ALLOWED_PORTS: ${AI_REVIEW_ALLOWED_PORTS:-443}
      AI_REVIEW_POLL_INTERVAL_SECONDS: ${AI_REVIEW_POLL_INTERVAL_SECONDS:-5}
      AI_REVIEW_LEASE_SECONDS: ${AI_REVIEW_LEASE_SECONDS:-180}
      AI_REVIEW_HEARTBEAT_SECONDS: ${AI_REVIEW_HEARTBEAT_SECONDS:-45}
    # Không expose/publish port nào: worker chỉ nói chuyện với Mongo, MinIO và provider ra ngoài.
    depends_on:
      mongo:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    # SIGTERM dừng ở ranh giới job. Hết ân hạn thì job bị cắt, và lease hết hạn sẽ được
    # `recover_expired` thu hồi ở lượt sau - chậm hơn, không sai.
    stop_grace_period: 120s
    healthcheck:
      # Worker ghi file này mỗi vòng lặp kể cả khi hàng đợi rỗng (`worker.py:_touch`). Một lượt gọi
      # provider tối đa 60s (AI_REVIEW_REQUEST_TIMEOUT_SECONDS) nên 300s là mốc "vòng lặp đã chết"
      # chứ không phải "đang chạy job dài". Đổi AI_REVIEW_HEARTBEAT_FILE thì phải đổi cả đường dẫn ở đây.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,sys,time; p='/tmp/ai-review-worker.heartbeat'; m=os.stat(p).st_mtime if os.path.exists(p) else 0; sys.exit(0 if time.time()-m < 300 else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    volumes:
      - data:/data

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    # KHÔNG publish 9000/9001 ra host: MinIO chỉ nằm trong Docker network, không route Nginx,
    # không console public (ADR-028).
    expose:
      - "9000"
    volumes:
      - minio_data:/data
    healthcheck:
      # `mc` có sẵn trong image MinIO (đã kiểm chứng trên đúng tag này), không cần curl/wget ngoài.
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    # One-shot: tạo bucket private + app user least-privilege rồi thoát. Chạy lại service này khi
    # cần xoay credential app (script luôn ép lại trạng thái theo env).
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-app}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-appsecret}
      MINIO_BUCKET: ${MINIO_BUCKET:-submission-artifacts}
    volumes:
      - ./scripts/minio_init.sh:/bootstrap.sh:ro
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-changeme}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-changeme}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-ai_challenge}
    # KHÔNG publish 27017 ra host/public (master context §13)
    expose:
      - "27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  mongo_data:
  data:
  minio_data:
