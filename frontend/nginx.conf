server {
    listen 80;
    server_name _;

    # Một submission gửi cả CSV (MAX_UPLOAD_MB=10) lẫn notebook (MAX_NOTEBOOK_MB=20) trong cùng một
    # request multipart, nên trần phải phủ tổng hai file + overhead của multipart. Backend vẫn là nơi
    # chốt giới hạn thật của từng file.
    client_max_body_size 32m;

    # Security headers cơ bản (master context §13)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # /data tuyệt đối không được serve (ADR-003) - chỉ chặn tường minh để fail closed
    location /data/ {
        return 404;
    }

    # Healthcheck nội bộ cho Docker: trả lời tĩnh, không phụ thuộc SPA build hay API
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API -> FastAPI container (ADR-002)
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA static + fallback cho client-side routing
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
