server {
    listen 80;
    server_name _;

    # Upload/body limit baseline — sync với MAX_UPLOAD_MB ở backend khi cần
    client_max_body_size 12m;

    # Security headers cơ bản (master context §13)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # /data tuyệt đối không được serve (ADR-003) — chỉ chặn tường minh để fail closed
    location /data/ {
        return 404;
    }

    # API -> FastAPI container (ADR-002)
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA static + fallback cho client-side routing
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
